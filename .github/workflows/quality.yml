name: Calidad del juego

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Pruebas de lógica y progresión
        run: npm test
      - name: Exportar versión web
        run: npm run build:web
      - name: Instalar Chromium para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador del juego exportado
        run: npm run test:browser
      - name: Conservar capturas y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
