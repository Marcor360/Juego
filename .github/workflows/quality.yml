name: Calidad del juego

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Pruebas de lógica y progresión
        run: npm test
      - name: Exportar versión web
        run: npm run build:web
